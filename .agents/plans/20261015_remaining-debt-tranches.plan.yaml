schema: agent.development_plan
schema_version: '1.0'
metadata:
  id: remaining-debt-tranches
  title: Workspace concurrency, economics, distributed ownership and production trust
  status: ready
  version: '1.0'
  created: '2026-10-15'
  purpose: >-
    Project the operator-accepted remaining-debt order (A2 residual, then A4 residual, then A5
    upstream ownership, then A6 production trust) into a settlement graph on top of the settled
    20261014_experts-debt-closure mission and published Cognate 0.5.0.
source:
  authority: Operator acceptance of the recommended tranche order in this session (2026-10-15)
  inventory: docs/experts-debt-closure.md
  predecessor: .agents/plans/20261014_experts-debt-closure.plan.yaml (settled at fdc709b)
decisions:
  - Tranche order is operator-accepted as A2 residual, A4 residual, A5 upstream ownership, A6 production trust; dependency edges encode this order even where no technical prerequisite exists.
  - Consume only complete published Cognate releases; no local SDK sources, vendored tarballs or workspace aliases. Upstream work happens in the Cognate repo through an isolated task worktree with PR44-style gates (RED/GREEN regressions, exact-head CI/packaging, operator-authorized merge, linked release, registry audit, fresh-consumer proof).
  - Parallelism stays opt-in and conflict-aware. Unknown or unclassifiable work fails closed to the workspace-effects exclusion; eligibility is never widened silently.
  - Resource identities derive from authoritative application state (assignment/workspace/world records), not from run-supplied input; aliases must canonicalize or be denied.
  - Team admission/batching policy resolves from authoritative Team metadata inside the async eligibility lookup; the UI must state the effective policy truthfully, including serialized reasons.
  - Economics never treat unknown prices as zero; interrupted billing reservations reconcile rather than blindly repeat.
  - A3 generalization (generalized SDK inbox, standalone live steering) and the enumerated product debts remain tracked in the disposition matrix; they are out of this plan's scope.
  - Baseline and every settlement require actual store/runtime/browser evidence, not mock-only proofs.
  - Single-process admission remains the default until the T6/T7 verified multi-process release exists.
global_gates:
  - just typecheck
  - just verify
  - domainforge validate --format human .sea/interaction/interaction-model.sea
  - domainforge fmt --check .sea/interaction/interaction-model.sea
  - git diff --check
dependency_graph:
  edges: [[T0,T1],[T1,T2],[T2,T3],[T0,T4],[T3,T5],[T4,T5],[T5,T6],[T6,T7],[T7,T8],[T8,T9]]
  critical_path: [T0,T1,T2,T3,T5,T6,T7,T8,T9]
initial_state:
  current_task: T4
  last_settled_task: T3
progress:
  T0: >-
    Baseline settled on the clean fdc709b tree (7eabd82 adds only this plan): `just verify` passed
    1,153 tests / 1,147 pass / 6 skip / 0 fail, 7,408 assertions across 105 files in 583.82 s. The
    workspace-effect conflict inventory names all 11 mutating surfaces with their canonical resource
    identity (workspace / execution world / configuration) and authoritative source, and pins
    canonicalization, mutator-enumeration and fail-closed rules. The capacity 1/2/4/8 benchmark was
    refreshed with four fresh sweeps (medians 5643.9 / 4985.1 / 5064.5 / 5151.9 ms); the earlier
    single-trial capacity-8 regression did not reproduce (capacity 4 and 8 ranges overlap, 1.7 %
    median gap). New instrumented attribution (`test/experts-capacity-attribution.test.ts`) rules
    out full context materialization (0.03 % of elapsed) and attributes 62-64 % of elapsed to
    Experts-registry shared-state reads and aggregate CAS commits, with 48/49 and 44/45 CAS
    conflicts concentrated in concurrent assignment submission. Evidence:
    docs/experts-concurrency-benchmark.md.
  T1: >-
    Conflict-aware workspace-effect admission replaces the single global exclusion key with
    canonical per-resource keys derived from authoritative state (src/experts/admission.ts):
    tool-bearing Expert work keys by its Assignment's workspace record, coding sessions and
    subagents key by their validated workspace record, workspace/config runs key configuration plus
    the exact records they name, world mutators enumerate the workspaces they affect, cognitive runs
    key configuration plus their named world. Model-only Expert overlap semantics are unchanged;
    unknown, forged or unclassifiable identities fail closed to the unchanged global
    workbench:workspace-effects key. `test/J-EXPERT-workspace-admission.test.ts` passes 4 actual
    PostgreSQL journeys (disjoint-workspace overlap at capacity two with disjoint keys, aliased
    spellings collide on one key and serialize, forged identity denied effects and excluded,
    per-resource keys and overlap/serialization survive restart); `test/E2E-expert-workspace-admission.test.ts`
    passes a real Chromium two-workspace tool-bearing overlap journey; `test/expert-admission.test.ts`
    covers authoritative key derivation and fail-closed cases (10 tests). Known boundary recorded:
    local bash/run_code are not OS-contained; admission stays process-local by SDK contract and a
    key-waiting run occupies one bounded dispatch slot.
  T2: >-
    Team admission/batching policy resolves from authoritative Team metadata only: Team.limits gains
    maxConcurrentRuns (1-8, default 2) and admissionBatch (1-8, default 1). The eligibility lookup
    gives each Team run one admission lane key so a Team exceeding its policy waits even when host
    capacity is free; the completion bridge dispatches queued Team roots in the Team's batch; the
    Team editor and runtime inspection state the effective policy and serialized reasons; client
    policy fields (maxConcurrentRuns/admissionBatch/policy/limits) are refused on converse.
    `test/J-TEAM-admission.test.ts` passes 2 actual PostgreSQL journeys at capacity four (policy-one
    serializes disjoint runs with three free slots; policy-two overlaps them; batch-one defers the
    second root; forged policy refused), `test/E2E-team-admission.test.ts` passes a real Chromium
    Team-editor/inspection journey, and `test/expert-admission.test.ts` covers lane derivation
    (11 tests). Cross-process Team fairness is not claimed.
  T3: >-
    Capacity-8 throughput settlement. The capacity 1/2/4/8 benchmark was re-run (four sweeps) on
    the T1/T2 tree; the model-only solo workload holds no keys, so the policies neither widen nor
    narrow it. Medians: 6548.2 / 5230.5 / 5230.3 / 5690.4 ms. The measured capacity-8 shortfall is
    recorded as an accepted measured limit with isolated cause attribution (docs/experts-concurrency-benchmark.md):
    (a) no discrete capacity-8 regression exists — both four-sweep batches show overlapping
    capacity-4/8 ranges (T0 +1.7 %, T3 +8.8 % median gap against up to 20 % run-to-run spread);
    (b) the dominant cost is the capacity-independent Experts-registry read-modify-write traffic
    (62-64 % of elapsed at both capacities, 2.7-2.8 CAS retries per committed creation write),
    which saturates throughput near 1.5 assignments/s and is the A4 tranche's target; (c) a
    key-waiting run occupies one bounded dispatch slot (published-SDK semantics), recorded as a
    limit. Default capacity remains 1; single-trial measurements stay labeled as such.
tasks:
  T0:
    title: Baseline, workspace-effect conflict inventory and benchmark refresh
    depends_on: []
    changes: >-
      Record the fresh baseline on fdc709b (1153 tests); inventory every workspace-effect surface
      (tool-bearing Expert work, coding sessions, schedule dispatch, configuration) with the
      canonical resource identity each requires; refresh the capacity 1/2/4/8 benchmark and
      isolate the capacity-8 regression hypothesis (registry CAS, full context materialization).
    proves: The conflict inventory names each mutating surface and its authoritative resource identity source.
    does_not_prove: Any new overlap behavior; the inventory only grounds T1.
    gate: [just verify]
    evidence: docs/experts-concurrency-benchmark.md
  T1:
    title: Conflict-aware workspace-effect admission
    depends_on: [T0]
    changes: >-
      Replace the single global workspace-effects exclusion key with canonical per-resource keys
      (workspace, execution world, configuration) derived from authoritative state so provably
      disjoint work overlaps; same-resource work serializes; unknown classification fails closed.
      Keep model-only Expert overlap semantics unchanged.
    proves: Two tool-bearing runs on different workspaces overlap at capacity; runs sharing a canonical resource serialize; forged or aliased identities are denied.
    does_not_prove: Distributed safety; admission remains process-local by SDK contract.
    gate: [actual PostgreSQL overlap/exclusion/denial/restart journeys, browser journeys]
    teeth:
      - {attack: Two runs present aliased paths or distinct spellings of one workspace, expected: Canonical keys collide and the runs serialize}
      - {attack: A run claims a workspace identity absent from authoritative state, expected: Admission fails closed to exclusion}
    evidence: docs/experts-debt-closure.md
  T2:
    title: Team admission and batching policy
    depends_on: [T1]
    changes: >-
      Resolve per-Team maximum concurrent runs and batch policy from authoritative Team metadata
      inside the async eligibility lookup; surface the effective policy and serialized reasons in
      the Team editor and runtime inspection UI.
    proves: A Team exceeding its policy waits even when process capacity is free; policy reads come only from authoritative metadata.
    does_not_prove: Cross-process Team fairness.
    gate: [actual PostgreSQL Team policy journeys, browser journeys]
    teeth:
      - {attack: Stale or unauthorized client-supplied Team policy influences admission, expected: Refused; only authoritative metadata decides}
    evidence: docs/experts-and-teams.md
  T3:
    title: Capacity-8 throughput settlement
    depends_on: [T2]
    changes: >-
      Profile and repair the measured capacity-8 throughput regression, or record its cause as an
      accepted limit with evidence; re-run the benchmark across 1/2/4/8 with the T1/T2 policies.
    proves: Benchmark table refreshed with isolated cause attribution for capacity 8.
    does_not_prove: Portable throughput guarantees; single-trial measurements remain labeled as such.
    gate: [bun test --timeout 120000 test/experts-app-capacity.test.ts, just verify]
    evidence: docs/experts-concurrency-benchmark.md
  T4:
    title: Indexed retrieval and global root CAS
    depends_on: [T0]
    changes: >-
      Replace unbounded materialization on Workbench read paths with scoped indexed/paginated
      queries; complete the global root CAS over memory partitions and history.
    proves: Large-history reads stay bounded; source-erased or aliased partitions fail verification and invalidate projections.
    does_not_prove: Model tokenization or budget enforcement (T5).
    gate: [migration/recovery/scoped-load tests, storage benchmarks]
    teeth:
      - {attack: A partition row is erased or aliased at the source, expected: CAS verification fails and the public projection invalidates}
    evidence: docs/experts-storage.md
  T5:
    title: Exact tokenization, durable reservations and budget ceilings
    depends_on: [T3, T4]
    changes: >-
      Add model-specific tokenization for context accounting; durable pre-dispatch billing
      reservations with crash reconciliation; ordinary-session and global spending ceilings that
      fail closed on exhaustion.
    proves: Over-ceiling dispatch is refused; an interrupted reservation reconciles without double-counting or blind repeat; unknown prices surface as unknown.
    does_not_prove: Provider-side billing accuracy beyond observed usage receipts.
    gate: [economics journeys including real native runs and restart, browser usage inspection]
    teeth:
      - {attack: Owner is interrupted between reservation and provider dispatch, expected: Reconciliation required without blind repeat}
      - {attack: A price is unavailable at dispatch, expected: Never booked as zero}
    evidence: docs/expert-economics.md
  T6:
    title: Upstream run-write ownership design and supported publication
    depends_on: [T5]
    changes: >-
      In the Cognate repo through an isolated worktree: run-write fencing, authoritative
      store-time ownership, worker compatibility, two-process fault injection and
      ambiguous-effect recovery. PR44-style gates: RED/GREEN regressions, exact-head
      CI/packaging, operator-authorized merge, linked release, registry audit, fresh-consumer
      proof. Workbench does not consume until the release is complete and legitimate.
    proves: Stale owner writes are fenced; a killed owner's ambiguous external effects require reconciliation without blind repeat.
    does_not_prove: Exactly-once physical effects; commitments and reconciliation remain the contract.
    gate: [upstream conformance suites, two-process PostgreSQL crash and stale-writer journeys]
    teeth:
      - {attack: Owner killed after an external effect before receipt, expected: Reconciliation required without blind repeat}
      - {attack: An expired owner attempts to settle reclaimed work, expected: Stale settlement refused}
    evidence: upstream evidence documents plus a new docs/sdk release receipt
  T7:
    title: Workbench multi-process integration
    depends_on: [T6]
    changes: >-
      Consume only the complete published ownership release; expose multi-process operation
      behind verified configuration; add Workbench two-process crash and stale-writer journeys.
    proves: Two Workbench processes against one PostgreSQL store pass crash and stale-writer gates.
    does_not_prove: Production trust (T8); multi-user tenancy.
    gate: [just verify, two-process crash/stale-writer journeys]
    evidence: docs/experts-debt-closure.md
  T8:
    title: Production identity, authorization and aggregate containment
    depends_on: [T7]
    changes: >-
      Durable identities and sessions with revocation, tenant isolation, aggregate resource
      containment across processes, deployment hardening, and an independent security review.
      Replace the single-operator development authenticator only after isolation gates pass.
    proves: Cross-tenant access is refused; revoked sessions produce no further effects; aggregate quota exhaustion fails closed.
    does_not_prove: A production certification claim; findings from the independent review govern any residual label.
    gate: [tenant isolation, revocation, OS escape/egress/cancellation tests, independent security review]
    teeth:
      - {attack: A revoked session replays a captured request, expected: Refused with no durable effect}
      - {attack: Aggregate CPU/memory/process usage exceeds the configured quota, expected: New work fails closed}
    evidence: docs/experts-debt-verification.md plus the review artifact
  T9:
    title: Adversarial review, full verification, evidence and publication
    depends_on: [T8]
    changes: >-
      Reconcile all debt statuses against observed proof, run the final full gates, update
      DEBT/verification/status records, and commit and push without force.
    proves: Every disposition claim in the debt matrix matches recorded evidence; no claim exceeds its proof.
    does_not_prove: Closure of debts explicitly retained as open.
    gate: [just verify, upstream conformance/release verification, git diff --check]
    evidence: docs/experts-debt-verification.md

[package]
name = "cognate-workbench-shell"
version = "0.1.0"
description = "Cognate Workbench desktop shell: manages the local backend and hosts its UI in a native window"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cognate_workbench_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# Rust-invoked only (design §1 posture budget): the webview gets no capability file, so no
# plugin JS API is reachable from web content. The opener serves external links from the
# navigation handler; the dialog serves the fail-closed close confirmation and any future
# Rust-mediated save.
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

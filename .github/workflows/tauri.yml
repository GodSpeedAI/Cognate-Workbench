name: tauri

# Desktop shell: five-platform compile, bundle, and artifact upload on release
# candidates and tags. The T1 packaged smoke and T2 sidecar journey steps land with
# the packaged harness (desktop-native-completion B2) as gated steps in each job;
# this file ships the compile/bundle skeleton so platform failures surface early.
# macOS ARM64 runs on macos-15 per the owner's platform table (an upgrade from
# package.yml's macos-14); Intel stays on macos-15-intel.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: workbench-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: tauri ${{ matrix.tag }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: bun-linux-x64, tag: linux-x64, binding: linux-x64-gnu, bundles: deb, paths: 'bundle/deb/*.deb' }
          - { runner: ubuntu-22.04-arm, target: bun-linux-arm64, tag: linux-arm64, binding: linux-arm64-gnu, bundles: deb, paths: 'bundle/deb/*.deb' }
          - { runner: macos-15, target: bun-darwin-arm64, tag: darwin-arm64, binding: darwin-arm64, bundles: 'app,dmg', paths: 'bundle/dmg/*.dmg' }
          - { runner: macos-15-intel, target: bun-darwin-x64, tag: darwin-x64, binding: darwin-x64, bundles: 'app,dmg', paths: 'bundle/dmg/*.dmg' }
          - { runner: windows-2022, target: bun-windows-x64, tag: windows-x64, binding: win32-x64-msvc, bundles: nsis, paths: 'bundle/nsis/*.exe' }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build DomainForge ${{ matrix.binding }} binding
        if: matrix.binding != 'linux-x64-gnu'
        uses: ./.github/actions/domainforge-binding
        with:
          binding: ${{ matrix.binding }}
      - name: Stage the sidecar and resources
        run: bun scripts/tauri-sidecar.ts ${{ matrix.target }}
      - name: Build and bundle the shell
        run: bun run tauri build --config src-tauri/tauri.conf.override.json --bundles ${{ matrix.bundles }}
      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.tag }}
          path: src-tauri/target/release/${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 30

      # ---- T1 packaged smoke — macOS launches the .app in the runner's GUI session ----
      - name: T1 packaged smoke (launch, health, single-instance, close-cleanup, respawn)
        if: runner.os == 'macOS'
        run: WB_TAURI_CHECK_IDENTITY=1 scripts/qualify-tauri.sh --bundle "src-tauri/target/release/bundle/dmg/*.dmg"

      # ---- T1 packaged smoke (desktop-native-completion B2 harness) — Linux, under Xvfb ----
      - name: Install Xvfb (T1/T2)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb
      - name: T1 packaged smoke (launch, health, single-instance, close-cleanup, respawn)
        if: runner.os == 'Linux'
        run: WB_TAURI_CHECK_IDENTITY=1 scripts/qualify-tauri.sh --bundle "src-tauri/target/release/bundle/deb/*.deb" --xvfb
      # ---- T2 sidecar journey (E2E-terminal against the packaged sidecar, not the dev server) ----
      - name: Install Chromium (T2)
        if: runner.os == 'Linux'
        run: bun x playwright install --with-deps chromium
      - name: T2 sidecar journey (E2E-terminal against the packaged sidecar)
        if: runner.os == 'Linux'
        run: |
          DEB="$(ls src-tauri/target/release/bundle/deb/*.deb)"
          EXTRACT="$RUNNER_TEMP/t2-install"
          dpkg-deb -x "$DEB" "$EXTRACT"
          # The deb strips the externalBin's rust triple at install: the sidecar is the bare
          # cognate-workbench next to the main binary. (A failing [ -n ] && [ -n ] would NOT
          # abort under set -e — fail explicitly.)
          SIDECAR="$(find "$EXTRACT" -type f -name 'cognate-workbench' | head -1)"
          RESOURCES="$(find "$EXTRACT" -type d -name 'cognate-workbench' -path '*resources*' | head -1)"
          if [ -z "$SIDECAR" ] || [ -z "$RESOURCES" ]; then
            echo "sidecar=$SIDECAR resources=$RESOURCES"
            exit 1
          fi
          export COGNATE_TEST_SIDECAR="$SIDECAR" COGNATE_TEST_SIDECAR_RESOURCES="$RESOURCES"
          xvfb-run -a bun test test/E2E-terminal.test.ts

  msrv:
    # The Jetson gate: the shell must compile under the device's toolchain version
    # (Rust 1.95) before the Jetson runbook promises the build works there. A real
    # cargo build, not a check.
    name: msrv (Rust 1.95 — Jetson gate)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # tauri.conf's externalBin/resource contract needs the sidecar binary in place before
      # cargo build (the B-qualify failure: `resource path binaries/... doesn't exist`).
      - name: Stage the sidecar and resources
        run: bun scripts/tauri-sidecar.ts bun-linux-x64
      - name: Compile the shell under the Jetson toolchain version
        working-directory: src-tauri
        run: cargo build

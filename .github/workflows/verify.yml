name: verify

# Required-check name: `verify` (the aggregate job at the bottom). The test suite is split across
# SHARDS jobs, each with its own PostgreSQL service; `ci/test-timings.json` balances the shards by
# measured duration (regenerate with `just test-timings` output, see ci/README.md).
on:
  push:
    branches: [main, migration/**]
    paths-ignore: ['**/*.md', 'docs/**', '.agents/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.agents/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - run: bun install --frozen-lockfile
      - run: just typecheck
      - run: just smoke

  test:
    name: test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COGNATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Each shard owns its PostgreSQL service and one test process: the operator-declared single-writer deployment fact (§1.5).
      COGNATE_CAPABILITY_SINGLE_WRITER: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      # Every test server holds an 11-connection pool (10 + LISTEN) and one shard keeps many alive,
      # which can exceed the image's default of 100 connections.
      - name: Raise PostgreSQL max_connections
        run: |
          cid="$(docker ps -q --filter ancestor=postgres:18 | head -1)"
          docker exec "$cid" psql -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart "$cid"
          until docker exec "$cid" pg_isready -U postgres; do sleep 1; done
      - run: bun install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(grep -oP '"playwright@\K[0-9.]+' bun.lock | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}-${{ runner.os }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bun x playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bun x playwright install-deps chromium
      - name: Cache pinned RealityTrace CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tmp/realitytrace
          key: realitytrace-0.4.0-${{ runner.os }}
      - name: Install pinned RealityTrace CLI for integration tests
        run: '[ -x .tmp/realitytrace/bin/realitytrace ] || just setup-realitytrace'
      - name: Cache pinned DomainForge CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tmp/domainforge
          key: domainforge-0.22.0-${{ runner.os }}
      - name: Install pinned DomainForge CLI for the SEA format test
        run: |
          [ -x .tmp/domainforge/bin/domainforge ] || just setup-domainforge
          echo "$PWD/.tmp/domainforge/bin" >> "$GITHUB_PATH"
          [ "$(.tmp/domainforge/bin/domainforge --version)" = "domainforge 0.22.0" ]
      - name: Run Workbench test shard
        run: just test-shard ${{ matrix.shard }} 4
      - name: Upload measured timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-timings-${{ matrix.shard }}
          path: .tmp/test-timings.json
          if-no-files-found: ignore

  tauri-linux:
    # Per-commit desktop-shell gate: Rust gates + a debug compile of the Tauri shell.
    # The packaged smoke step lands with the harness (desktop-native-completion B2).
    # The Rust cache is restored on every run but saved only from main, so a pull request can
    # never write a cache that later runs trust; the cache key includes Cargo.lock and the toolchain.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: rust-1.99.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Tauri Linux build dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          version: 1.0
      - run: bun install --frozen-lockfile
      # tauri.conf's externalBin contract needs the sidecar binary in place for any cargo step
      # (the msrv job needed the same staging).
      - name: Stage the sidecar and resources
        run: bun scripts/tauri-sidecar.ts bun-linux-x64
      - name: Rust gates (fmt, clippy, test)
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets
          cargo test
      - name: Debug compile of the shell
        run: bun run tauri build --debug --no-bundle

  verify:
    name: verify
    if: always()
    needs: [checks, test, tauri-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verify job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

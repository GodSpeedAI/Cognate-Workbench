name: verify

on:
  push:
    branches: [main, migration/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COGNATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: extractions/setup-just@v2
      - name: Install published Cognate SDK dependencies
        run: bun install
      - name: Typecheck standalone app
        run: just typecheck
      - name: Run deterministic Workbench smoke tests
        run: just smoke
      - name: Install Chromium
        run: bun x playwright install --with-deps chromium
      - name: Install pinned RealityTrace CLI for integration tests
        run: just setup-realitytrace
      - name: Cache pinned DomainForge CLI
        uses: actions/cache@v4
        with:
          path: .tmp/domainforge
          key: domainforge-0.21.2-${{ runner.os }}
      - name: Install pinned DomainForge CLI for the SEA format test
        run: |
          [ -x .tmp/domainforge/bin/domainforge ] || just setup-domainforge
          echo "$PWD/.tmp/domainforge/bin" >> "$GITHUB_PATH"
          [ "$(.tmp/domainforge/bin/domainforge --version)" = "domainforge 0.21.2" ]
      - name: Run complete Workbench application test suite
        run: just test

  tauri-linux:
    # Per-commit desktop-shell gate: Rust gates + a debug compile of the Tauri shell.
    # The packaged smoke step lands with the harness (desktop-native-completion B2).
    # No Rust cache on purpose: a stale-cold build is minutes; a poisoned cache that
    # masks breakage is hours (the shell's clean builds are reproducible by design).
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Rust gates (fmt, clippy, test)
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets
          cargo test
      - name: Debug compile of the shell
        run: bun run tauri build --debug --no-bundle

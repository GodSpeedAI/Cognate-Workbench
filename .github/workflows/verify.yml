name: verify

on:
  push:
    branches: [main, migration/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COGNATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: extractions/setup-just@v2
      - name: Install published Cognate SDK dependencies
        run: bun install
      - name: Typecheck standalone app
        run: just typecheck
      - name: Run deterministic Workbench smoke tests
        run: just smoke
      - name: Install Chromium
        run: bun x playwright install --with-deps chromium
      - name: Install pinned RealityTrace CLI for integration tests
        run: just setup-realitytrace
      - name: Cache pinned DomainForge CLI
        uses: actions/cache@v4
        with:
          path: .tmp/domainforge
          key: domainforge-0.21.1-${{ runner.os }}
      - name: Install pinned DomainForge CLI for the SEA format test
        run: |
          [ -x .tmp/domainforge/bin/domainforge ] || just setup-domainforge
          echo "$PWD/.tmp/domainforge/bin" >> "$GITHUB_PATH"
          [ "$(.tmp/domainforge/bin/domainforge --version)" = "domainforge 0.21.1" ]
      - name: Run complete Workbench application test suite
        run: just test
